name: Update car data around the clock

on:
  schedule:
    - cron: '30 2,8,14,20 * * *'   # four times a day: 02:30, 08:30, 14:30 and 20:30 UTC
  workflow_dispatch:                # lets you run everything by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Every run (every 6 hours)
      - name: Collect headlines
        run: node scripts/update-news.mjs
      - name: Collect the Formula 1 schedule
        run: node scripts/update-races.mjs

      # Once a day (the 02:30 UTC run, or when run by hand)
      - name: Collect official car specs and safety ratings
        run: |
          if [ "$(date -u +%H)" = "02" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/update-cars.mjs
          fi

      # Once a week (Sundays at the 02:30 UTC run, or when run by hand)
      - name: Collect the worldwide model list
        run: |
          if { [ "$(date -u +%u)" = "7" ] && [ "$(date -u +%H)" = "02" ]; } || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/update-world.mjs
          fi

      - name: Save changes
        run: |
          git config user.name "hashpatrol-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data
          git diff --staged --quiet || (git commit -m "Update data" && git pull --rebase && git push)
